# Test Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:projectmatchtest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway for Testing
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate for Testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Test JWT
jwt.secret=TestSecretKeyMustBeAtLeast256BitsLongForHmacSha256SignatureAlgorithm2026
jwt.expiration=3600000

# CORS
cors.allowed-origins=http://localhost:5173

# Server Port
server.port=0
